<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smooth Scroll Video</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: Roboto, -apple-system, sans-serif;
      background: #000;
      color: #fff;
    }

    html.lenis, html.lenis body {
      height: auto;
    }

    .lenis.lenis-smooth {
      scroll-behavior: auto !important;
    }

    .loader {
      position: fixed;
      inset: 0;
      --blur-amount: 50px;
      backdrop-filter: blur(var(--blur-amount));
      z-index: 1000;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .loader-inner {
      height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: start;
      justify-content: end;
    }

    .loader.hidden {
      opacity: 0;
      visibility: hidden;
      --blur-amount: 0px;
    }

    .loader-text {
      font-size: clamp(4rem, (5vw + 2rem), 10rem);
      font-weight: bold;
      padding-left: 0.2em;
    }

    .loader-bar {
      width: 100%;
      height: 1rem;
      background: rgba(255,255,255,0.2);
      overflow: hidden;
    }

    .loader-fill {
      height: 100%;
      background: linear-gradient(90deg, white);
      width: 0%;
      transition: width 0.1s ease;
    }

    .scene-1-section {
      position: relative;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .scene-1-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tap-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .tap-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .play-button {
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      transition: transform 0.3s ease, background 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .play-button img, .play-button svg {
      display: block;
      width: 2.5rem;
      height: 2.5rem;
      object-fit: contain;
    }

    .play-button:hover {
      transform: scale(1.1);
      background: rgba(255, 255, 255, 0.1);
    }

    .tap-text {
      font-size: 12px;
      text-transform: uppercase;
      font-weight: bold;
      text-shadow: 2px 2px #000;
      letter-spacing: 1px;
    }

    .canvas-1-section,
    .canvas-2-section,
    .canvas-3-section,
    .canvas-4-section,
    .canvas-5-section,
    .canvas-6-section {
      position: relative;
      height: 130vh;
    }
    
    .yoga-to-karate-canvas-section {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }
    
    .yoga-to-karate-canvas-section .canvas-container {
      position: relative;
      height: 100vh;
    }
    
    .swipe-dragger {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      z-index: 10;
      pointer-events: none;
      padding-top: 110%;
    }
    
    .swipe-track {
      width: 110px;
      height: 10px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 2rem;
      position: relative;
      pointer-events: auto;
      box-shadow: 2px 2px 0 #00000050;
    }
    
    .swipe-track::after {
      content: '';
      position: absolute;
      top: 0;
      height: 100%;
      background: rgba(255, 255, 255, 1);
      border-radius: 2rem;
      transition: width 0.05s ease;
    }
    
    .swipe-track.swipe-rtl::after {
      right: 0;
      width: var(--swipe-progress, 0%);
    }
    
    .swipe-track.swipe-ltr::after {
      left: 0;
      width: var(--swipe-progress, 0%);
    }
    
    .swipe-thumb {
      position: absolute;
      top: 50%;
      left: 90px; /* 110 - 40/2 = centered at right edge */
      transform: translateY(-50%) rotate(90deg);
      width: 2.5rem;
      height: 2.5rem;
      cursor: grab;
      z-index: 2;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
      animation: swipe-hint-left 1s ease-in-out infinite;
    }
    
    .swipe-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .swipe-thumb:active {
      cursor: grabbing;
      transform: translateY(-50%) rotate(90deg) scale(1.1);
    }
    
    @keyframes swipe-hint-left {
      0%, 100% { transform: translateY(-50%) rotate(90deg) translateY(0); }
      50% { transform: translateY(-50%) rotate(90deg) translateY(-3px); }
    }
    
    .canvas-4-section {
      height: 100vh;
      overflow: hidden;
    }
    
    .canvas-4-section .canvas-container {
      position: relative;
      height: 100vh;
    }
    
    .swipe-thumb-left {
      position: absolute;
      top: 50%;
      left: -20px; /* 0 - 40/2 = centered at left edge */
      transform: translateY(-50%) rotate(-90deg);
      width: 2.5rem;
      height: 2.5rem;
      cursor: grab;
      z-index: 2;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
      animation: swipe-hint-right 1s ease-in-out infinite;
    }
    
    .swipe-thumb-left img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .swipe-thumb-left:active {
      cursor: grabbing;
      transform: translateY(-50%) rotate(-90deg) scale(1.1);
    }
    
    @keyframes swipe-hint-right {
      0%, 100% { transform: translateY(-50%) rotate(-90deg) translateY(0); }
      50% { transform: translateY(-50%) rotate(-90deg) translateY(-3px); }
    }

    .canvas-1-section {
      height: 110vh;
    }

    .canvas-2-section {
      height: 150vh;
    }

    .canvas-3-section {
      height: 140vh;
    }

    .canvas-container {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #frame-canvas,
    #frame-canvas-2,
    #frame-canvas-3,
    #frame-canvas-4,
    #frame-canvas-5,
    #frame-canvas-6,
    #frame-yoga-to-karate-canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scroll-hint {
      position: absolute;
      inset: 0;
    }

    .scroll-hint .inner {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      height: 100svh;
      justify-content: center;
      align-items: center;
      padding-bottom: 2rem;
      padding-top: 110%;
    }

    .scroll-hint .inner img,
    .scroll-hint .inner svg {
      display: block;
      width: 2.5rem;
      height: 2.5rem;
      object-fit: contain;
      animation: scroll-hint-animation 1s ease-in-out infinite alternate;
    }

    .scroll-hint .inner .text {
      font-size: 12px;
      text-transform: uppercase;
      font-weight: bold;
      text-shadow: 2px 2px #000;
      letter-spacing: 1px;
    }

    .scene-2-section,
    .scene-3-section,
    .scene-4-section,
    .scene-5-section,
    .scene-6-section,
    .scene-7-section,
    .breathing-scene-section {
      position: relative;
      height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .scene-2-video,
    .scene-3-video,
    .scene-4-video,
    .scene-5-video,
    .scene-6-video,
    .scene-7-video,
    .breathing-scene-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scene-1-video:focus,
    .scene-2-video:focus,
    .scene-3-video:focus,
    .scene-4-video:focus,
    .scene-5-video:focus,
    .scene-6-video:focus,
    .scene-7-video:focus,
    .breathing-scene-video:focus {
      outline: none;
    }

    .scene-1-video:active,
    .scene-2-video:active,
    .scene-3-video:active,
    .scene-4-video:active,
    .scene-5-video:active,
    .scene-6-video:active,
    .scene-7-video:active,
    .breathing-scene-video:active {
      outline: none;
    }

    body.no-scroll {
      overflow: hidden;
    }

    .pause-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: opacity 0.3s ease;
      pointer-events: none;
      opacity: 0;
    }

    .pause-button {
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pause-button img,
    .pause-button svg {
      display: block;
      width: 2.5rem;
      height: 2.5rem;
      object-fit: contain;
    }

    .scene-1-section.paused .pause-overlay,
    .scene-2-section.paused .pause-overlay,
    .scene-3-section.paused .pause-overlay,
    .scene-4-section.paused .pause-overlay,
    .scene-5-section.paused .pause-overlay,
    .scene-6-section.paused .pause-overlay,
    .scene-7-section.paused .pause-overlay,
    .breathing-scene-section.paused .pause-overlay {
      opacity: 1;
    }

    .menu-wrap {
      position: fixed;
      top: 4%;
      right: 6%;
      display: none;
      flex-direction: column;
      align-items: end;
      pointer-events: none;
      z-index: 99;
    }

    .menu-button {
      all: unset;
      pointer-events: auto;
      border-radius: 50%;
    }

    .menu-button img {
      width: 2.5rem;
      height: 2.5rem;
      object-fit: contain;
      transition: transform 0.3s ease;
      display: block;
    }

    .menu-button:active img {
      transform: scale(0.9);
    }

    .menu-nav {
      background-color: #ffffff80;
      display: flex;
      flex-direction: column;
      justify-content: start;
      clip-path: inset(0% 0% 100% 100%);
      transition: clip-path 0.3s ease;
      min-width: 200px;
    }

    .menu-nav button {
      all: unset;
      display: block;
      padding: 8px;
    }

    .menu-nav button[data-scene="2"] img {
      scale: 1.136;
      transform-origin: left;
    }

    .menu-nav button img {
      width: 150px;
      object-fit: contain;
    }

    .menu-nav button.active {
      background-color: #fff;
    }

    .menu-wrap.open .menu-nav {
      clip-path: inset(0% 0% 0% 0%);
      pointer-events: auto;
    }

    .rewind-button {
      all: unset;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .rewind-button img {
      width: 2.5rem;
      height: 2.5rem;
    }

    .home-link {
      all: unset;
      position: absolute;
      bottom: 26%;
      right: 18%;
    }

    .home-link img {
      height: 2rem;
      width: auto;
    }

    .progress-circle {
      position: absolute;
      top: 2rem;
      left: 6%;
      width: 2.5rem;
      height: 2.5rem;
      z-index: 10;
      pointer-events: none;
    }

    .progress-circle svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .progress-circle .progress-ring {
      fill: none;
      stroke: rgba(255, 255, 255, 0.5);
      stroke-width: 2;
    }

    .progress-circle .progress-fill {
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-dasharray: 100.53;
      stroke-dashoffset: 100.53;
      transition: stroke-dashoffset 0.1s ease;
    }

    @keyframes scroll-hint-animation {
      from { transform: translateY(-5px); }
      to { transform: translateY(5px); }
    }

    /* Landscape orientation - contain videos and canvases */
    @media (orientation: landscape) {
      .scene-1-video,
      .scene-2-video,
      .scene-3-video,
      .scene-4-video,
      .scene-5-video,
      .scene-6-video,
      .scene-7-video,
      .breathing-scene-video {
        object-fit: contain;
        background: #000;
      }

      #frame-canvas,
      #frame-canvas-2,
      #frame-canvas-3,
      #frame-canvas-4,
      #frame-canvas-5,
      #frame-canvas-6,
      #frame-yoga-to-karate-canvas {
        object-fit: contain;
      }

      .canvas-container {
        background: #000;
      }
    }
  </style>
</head>

  <script>
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    const FRAME_COUNT = 27;
    const FRAME_PATH = 'frames/frame_';
    const FRAME_EXT = '.webp';
    
    const FRAME_COUNT_2 = 129;
    const FRAME_PATH_2 = 'frames-2/frame_';
    const FRAME_EXT_2 = '.webp';
    
    const FRAME_COUNT_3 = 35;
    const FRAME_PATH_3 = 'frames-3/frame_';
    const FRAME_EXT_3 = '.webp';
    
    const FRAME_COUNT_4 = 40;
    const FRAME_PATH_4 = 'frames-4/frame_';
    const FRAME_EXT_4 = '.webp';
    
    const FRAME_COUNT_5 = 56;
    const FRAME_PATH_5 = 'frames-5/frame_';
    const FRAME_EXT_5 = '.webp';

    const FRAME_COUNT_6 = 30;
    const FRAME_PATH_6 = 'frames-6/frame_';
    const FRAME_EXT_6 = '.webp';

    const YOGA_TO_KARATE_FRAME_COUNT = 49;
    const YOGA_TO_KARATE_FRAME_PATH = 'yoga-to-karate-frames/frame_';
    const YOGA_TO_KARATE_FRAME_EXT = '.webp';

    const canvas = document.getElementById('frame-canvas');
    const ctx = canvas.getContext('2d');
    const canvas1Section = document.getElementById('canvas-1-section');
    const canvas2 = document.getElementById('frame-canvas-2');
    const ctx2 = canvas2.getContext('2d');
    const canvas2Section = document.getElementById('canvas-2-section');
    const loader = document.getElementById('loader');

        const blurAmount = 50 * (1 - totalProgress / 100);
        loader.style.setProperty('--blur-amount', blurAmount + 'px');

    // Yoga swipe handler
    let yogaSwipeActive = false;
    let yogaSwipeStartX = 0;
    let yogaSwipeProgress = 0;
    
    function setupYogaSwipe() {
      if (!yogaSwipeTrack || !yogaSwipeThumb) return;
      
      const trackWidth = 110;
      const thumbWidth = 40;
      
      function updateThumbPosition(progress) {
        // Thumb centered at progress bar edge
        const offset = trackWidth * (1 - progress) - thumbWidth / 2;
        yogaSwipeThumb.style.right = 'auto';
        yogaSwipeThumb.style.left = offset + 'px';
        yogaSwipeTrack.style.setProperty('--swipe-progress', (progress * 100) + '%');
      }
      
      function handleSwipeStart(e) {
        if (yogaToKarateFirstScrollTriggered) return;
        yogaSwipeActive = true;
        yogaSwipeStartX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        e.preventDefault();
      }
      
      function handleSwipeMove(e) {
        if (!yogaSwipeActive || yogaToKarateFirstScrollTriggered) return;
        
        const currentX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        const deltaX = yogaSwipeStartX - currentX;
        
        yogaSwipeProgress = Math.max(0, Math.min(1, deltaX / 150));
        
        updateThumbPosition(yogaSwipeProgress);
        
        const frameIndex = Math.floor(yogaSwipeProgress * (YOGA_TO_KARATE_FRAME_COUNT - 1));
        if (frameIndex !== currentYogaToKarateFrame) {
          drawYogaToKarateFrame(frameIndex);
        }
        updateCanvasProgress('yoga', yogaSwipeProgress);
        
        if (yogaSwipeProgress >= 0.95) {
          yogaSwipeActive = false;
          yogaToKarateFirstScrollTriggered = true;
          if (yogaSwipeDragger) yogaSwipeDragger.style.display = 'none';
          drawYogaToKarateFrame(YOGA_TO_KARATE_FRAME_COUNT - 1);
          updateCanvasProgress('yoga', 1);
          currentYogaToKarateFrame = YOGA_TO_KARATE_FRAME_COUNT - 1;
          targetYogaToKarateFrame = YOGA_TO_KARATE_FRAME_COUNT - 1;
          setTimeout(function() { playScene5(); }, 100);
        }
        
        e.preventDefault();
      }
      
      function handleSwipeEnd() {
        if (!yogaSwipeActive) return;
        yogaSwipeActive = false;
        
        if (yogaSwipeProgress < 0.95 && !yogaToKarateFirstScrollTriggered) {
          yogaSwipeProgress = 0;
          updateThumbPosition(0);
          drawYogaToKarateFrame(0);
          updateCanvasProgress('yoga', 0);
        }
      }
      
      yogaSwipeTrack.addEventListener('mousedown', handleSwipeStart);
      yogaSwipeThumb.addEventListener('mousedown', handleSwipeStart);
      document.addEventListener('mousemove', handleSwipeMove);
      document.addEventListener('mouseup', handleSwipeEnd);
      
      yogaSwipeTrack.addEventListener('touchstart', handleSwipeStart, { passive: false });
      yogaSwipeThumb.addEventListener('touchstart', handleSwipeStart, { passive: false });
      document.addEventListener('touchmove', handleSwipeMove, { passive: false });
      document.addEventListener('touchend', handleSwipeEnd);
      
      yogaToKarateSection.addEventListener('touchstart', function(e) {
        if (yogaToKarateFirstScrollTriggered) return;
        yogaSwipeActive = true;
        yogaSwipeStartX = e.touches[0].clientX;
      }, { passive: true });
      
      yogaToKarateSection.addEventListener('touchmove', handleSwipeMove, { passive: false });
      yogaToKarateSection.addEventListener('touchend', handleSwipeEnd);
    }

          drawFrame4(FRAME_COUNT_4 - 1);
          updateCanvasProgress(4, 1);
          currentFrame4 = FRAME_COUNT_4 - 1;
          targetFrame4 = FRAME_COUNT_4 - 1;
          setTimeout(function() { playScene6(); }, 100);

        e.preventDefault();
      }
      
      function handleSwipeEnd() {
        if (!canvas4SwipeActive) return;
        canvas4SwipeActive = false;
        
        if (canvas4SwipeProgress < 0.95 && !canvas4FirstScrollTriggered) {
          canvas4SwipeProgress = 0;
          updateThumbPosition(0);
          drawFrame4(0);
          updateCanvasProgress(4, 0);
        }
      }
      
      canvas4SwipeTrack.addEventListener('mousedown', handleSwipeStart);
      canvas4SwipeThumb.addEventListener('mousedown', handleSwipeStart);
      document.addEventListener('mousemove', handleSwipeMove);
      document.addEventListener('mouseup', handleSwipeEnd);
      
      canvas4SwipeTrack.addEventListener('touchstart', handleSwipeStart, { passive: false });
      canvas4SwipeThumb.addEventListener('touchstart', handleSwipeStart, { passive: false });
      document.addEventListener('touchmove', handleSwipeMove, { passive: false });
      document.addEventListener('touchend', handleSwipeEnd);
      
      canvas4Section.addEventListener('touchstart', function(e) {
        if (canvas4FirstScrollTriggered) return;

      canvas4Section.addEventListener('touchend', handleSwipeEnd);

    // Auto-complete animation - used for canvas 1, 3, yoga-to-karate, 5, and 6
    function animateCanvasToEnd(canvasIndex, frameCount, drawFunction, onComplete, startFrameIndex = 0) {
      const startFrame = Math.max(0, Math.min(startFrameIndex, frameCount - 1));
      const remainingFrames = frameCount - 1 - startFrame;
      const duration = remainingFrames * 25;
      const startTime = performance.now();
      let currentFrameIndex = startFrame;
      
      // Draw the starting frame immediately
      drawFunction(startFrame);
      updateCanvasProgress(canvasIndex, startFrame / (frameCount - 1));
      
      isAutoAnimating = true;
      document.body.classList.add('no-scroll');
      
      function animateLoop(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const frameIndex = Math.floor(startFrame + progress * remainingFrames);
        
        if (frameIndex !== currentFrameIndex && frameIndex < frameCount) {
          currentFrameIndex = frameIndex;
          drawFunction(frameIndex);
          updateCanvasProgress(canvasIndex, frameIndex / (frameCount - 1));
        }
        
        if (progress < 1) {
          requestAnimationFrame(animateLoop);
        } else {
          drawFunction(frameCount - 1);
          updateCanvasProgress(canvasIndex, 1);
          
          if (canvasIndex === 1) {
            currentFrame = frameCount - 1;
            targetFrame = frameCount - 1;
          } else if (canvasIndex === 2) {
            currentFrame2 = frameCount - 1;
            targetFrame2 = frameCount - 1;
          } else if (canvasIndex === 3) {
            currentFrame3 = frameCount - 1;
            targetFrame3 = frameCount - 1;
          } else if (canvasIndex === 4) {
            currentFrame4 = frameCount - 1;
            targetFrame4 = frameCount - 1;
          } else if (canvasIndex === 'yoga') {
            currentYogaToKarateFrame = frameCount - 1;
            targetYogaToKarateFrame = frameCount - 1;
          } else if (canvasIndex === 5) {
            currentFrame5 = frameCount - 1;
            targetFrame5 = frameCount - 1;
          } else if (canvasIndex === 6) {
            currentFrame6 = frameCount - 1;
            targetFrame6 = frameCount - 1;
          }
          
          isAutoAnimating = false;
          setTimeout(onComplete, 100);
        }
      }
      
      requestAnimationFrame(animateLoop);
    }

    // Smooth interpolation animation loops
    function animate() {
      if (!isAutoAnimating) {
        const diff = targetFrame - currentFrame;
        if (Math.abs(diff) > 0.01) {
          const step = diff * 0.25;
          const nextFrame = Math.abs(step) < 1 ? currentFrame + Math.sign(diff) : Math.round(currentFrame + step);
          if (nextFrame !== currentFrame && nextFrame >= 0 && nextFrame < FRAME_COUNT) {
            drawFrame(nextFrame);
          }
        }
      }
      requestAnimationFrame(animate);
    }

    function initLenis() {
      lenis = new Lenis({
        duration: 1.2,
        easing: function(t) { return Math.min(1, 1.001 - Math.pow(2, -10 * t)); },
        orientation: 'vertical',
        gestureOrientation: 'vertical',
        smoothWheel: true,
        wheelMultiplier: 1,
        touchMultiplier: 2,
        infinite: false,
      });

      function raf(time) {
        lenis.raf(time);
        requestAnimationFrame(raf);
      }

      lenis.on('scroll', function(e) {
        var scroll = e.scroll;
        
        if (isAutoAnimating) return;
        
        if (scroll < maxScrollReached && !isCorrectingScroll) {
          isCorrectingScroll = true;
          lenis.scrollTo(maxScrollReached, { immediate: true });
          setTimeout(function() { isCorrectingScroll = false; }, 0);
          return;
        }
        maxScrollReached = scroll;

        // CANVAS-1: Auto-complete on first scroll
        if (canvas1Section.offsetParent !== null) {
          var sectionTop = canvas1Section.offsetTop;
          var sectionHeight = canvas1Section.offsetHeight - window.innerHeight;
          var scrollInSection = scroll - sectionTop;
          var sectionProgress = Math.max(0, Math.min(1, scrollInSection / sectionHeight));
          
          if (!canvas1FirstScrollTriggered && sectionProgress > AUTO_COMPLETE_THRESHOLD) {
            canvas1FirstScrollTriggered = true;
            const startFrame = Math.floor(sectionProgress * (FRAME_COUNT - 1));
            animateCanvasToEnd(1, FRAME_COUNT, drawFrame, function() { playScene2(); }, startFrame);
            return;
          }
          
          targetFrame = Math.floor(sectionProgress * (FRAME_COUNT - 1));
          updateCanvasProgress(1, sectionProgress);
          
          if (sectionProgress >= 0.98 && !scene2Played) {
            playScene2();
          }
        }

        // CANVAS-2: Auto-complete on first scroll
        if (canvas2Section.offsetParent !== null) {
          var sectionTop2 = canvas2Section.offsetTop;
          var sectionHeight2 = canvas2Section.offsetHeight - window.innerHeight;
          var scrollInSection2 = scroll - sectionTop2;
          var sectionProgress2 = Math.max(0, Math.min(1, scrollInSection2 / sectionHeight2));

          const AUTO_COMPLETE_THRESHOLD_CANVAS_2 = isAppleDevice ? 0.015 : 0.01;
          if (!canvas2FirstScrollTriggered && sectionProgress2 > AUTO_COMPLETE_THRESHOLD_CANVAS_2) {
            canvas2FirstScrollTriggered = true;
            const startFrame = Math.floor(sectionProgress2 * (FRAME_COUNT_2 - 1));
            // Draw frames 0 through startFrame quickly before auto-animating
            for (let i = 0; i <= startFrame; i++) {
              drawFrame2(i);
            }
            animateCanvasToEnd(2, FRAME_COUNT_2, drawFrame2, function() { playScene4(); }, startFrame);
            return;
          }
          
          targetFrame2 = Math.floor(sectionProgress2 * (FRAME_COUNT_2 - 1));
          updateCanvasProgress(2, sectionProgress2);
          
          if (sectionProgress2 >= 0.98 && !scene4Played) {
            playScene4();
          }
        }

        // CANVAS-3: Auto-complete on first scroll
        if (canvas3Section.offsetParent !== null) {
          var sectionTop3 = canvas3Section.offsetTop;
          var sectionHeight3 = canvas3Section.offsetHeight - window.innerHeight;
          var scrollInSection3 = scroll - sectionTop3;
          var sectionProgress3 = Math.max(0, Math.min(1, scrollInSection3 / sectionHeight3));
          
          if (!canvas3FirstScrollTriggered && sectionProgress3 > AUTO_COMPLETE_THRESHOLD) {
            canvas3FirstScrollTriggered = true;
            const startFrame = Math.floor(sectionProgress3 * (FRAME_COUNT_3 - 1));
            animateCanvasToEnd(3, FRAME_COUNT_3, drawFrame3, function() { playBreathingScene(); }, startFrame);
            return;
          }
          
          targetFrame3 = Math.floor(sectionProgress3 * (FRAME_COUNT_3 - 1));
          updateCanvasProgress(3, sectionProgress3);
          
          if (sectionProgress3 >= 0.98 && !breathingScenePlayed) {
            playBreathingScene();
          }
        }

        // YOGA-TO-KARATE CANVAS: Handled by swipe, lock scroll position only when at this section
        if (yogaToKarateSection.offsetParent !== null && !yogaToKarateFirstScrollTriggered && !yogaSwipeActive) {
          var yogaSectionTop = yogaToKarateSection.offsetTop;
          var scrollNearYoga = scroll >= yogaSectionTop - 50 && scroll <= yogaSectionTop + 50;
          if (scrollNearYoga) {
            lenis.scrollTo(yogaSectionTop, { immediate: true });
            maxScrollReached = yogaSectionTop;
          }
        }

        // CANVAS-4: Handled by swipe, lock scroll position only when at this section
        if (canvas4Section.offsetParent !== null && !canvas4FirstScrollTriggered && !canvas4SwipeActive) {
          var canvas4SectionTop = canvas4Section.offsetTop;
          var scrollNearCanvas4 = scroll >= canvas4SectionTop - 50 && scroll <= canvas4SectionTop + 50;
          if (scrollNearCanvas4) {
            lenis.scrollTo(canvas4SectionTop, { immediate: true });
            maxScrollReached = canvas4SectionTop;
          }
        }

        // CANVAS-5: Auto-complete on first scroll
        if (canvas5Section.offsetParent !== null) {
          var sectionTop5 = canvas5Section.offsetTop;
          var sectionHeight5 = canvas5Section.offsetHeight - window.innerHeight;
          var scrollInSection5 = scroll - sectionTop5;
          var sectionProgress5 = Math.max(0, Math.min(1, scrollInSection5 / sectionHeight5));
          
          if (!canvas5FirstScrollTriggered && sectionProgress5 > AUTO_COMPLETE_THRESHOLD) {
            canvas5FirstScrollTriggered = true;
            const startFrame = Math.floor(sectionProgress5 * (FRAME_COUNT_5 - 1));
            animateCanvasToEnd(5, FRAME_COUNT_5, drawFrame5, function() { playScene7(); }, startFrame);
            return;
          }
          
          targetFrame5 = Math.floor(sectionProgress5 * (FRAME_COUNT_5 - 1));
          updateCanvasProgress(5, sectionProgress5);
          
          if (sectionProgress5 >= 0.98 && !scene7Played) {
            playScene7();
          }
        }

        // CANVAS-6: Auto-complete on first scroll
        if (canvas6Section.offsetParent !== null) {
          var sectionTop6 = canvas6Section.offsetTop;
          var sectionHeight6 = canvas6Section.offsetHeight - window.innerHeight;
          var scrollInSection6 = scroll - sectionTop6;
          var sectionProgress6 = Math.max(0, Math.min(1, scrollInSection6 / sectionHeight6));
          
          if (!canvas6FirstScrollTriggered && sectionProgress6 > AUTO_COMPLETE_THRESHOLD) {
            canvas6FirstScrollTriggered = true;
            const startFrame = Math.floor(sectionProgress6 * (FRAME_COUNT_6 - 1));
            animateCanvasToEnd(6, FRAME_COUNT_6, drawFrame6, function() {
              if (canvas6ScrollHint) canvas6ScrollHint.style.display = 'none';
              if (rewindButton) rewindButton.style.display = 'block';
              if (homeLink) homeLink.style.display = 'block';
              if (progressCircle6) progressCircle6.style.display = 'none';
              canvas6Finished = true;
              stopScrollingSound();
            }, startFrame);
            return;
          }
          
          targetFrame6 = Math.floor(sectionProgress6 * (FRAME_COUNT_6 - 1));
          updateCanvasProgress(6, sectionProgress6);
          
          if (sectionProgress6 >= 0.98) {
            if (!canvas6Finished) {
              canvas6Finished = true;
              if (progressCircle6) progressCircle6.style.display = 'none';
            }
            stopScrollingSound();
          }
          
          if (sectionProgress6 >= 0.9) {
            if (canvas6ScrollHint) canvas6ScrollHint.style.display = 'none';
            if (rewindButton) rewindButton.style.display = 'block';
            if (homeLink) homeLink.style.display = 'block';
          } else {
            if (canvas6ScrollHint) canvas6ScrollHint.style.display = 'block';
            if (rewindButton) rewindButton.style.display = 'none';
            if (homeLink) homeLink.style.display = 'none';
          }
        }
        
        lastScrollPosition = scroll;
      });

      requestAnimationFrame(raf);
    }

    function updateCanvasProgress(canvasIndex, progress) {
      var circle;
      if (canvasIndex === 'yoga') {
        circle = progressCircleYoga;
      } else {
        var progressCircles = [progressCircle1, progressCircle2, progressCircle3, progressCircle4, progressCircle5, progressCircle6];
        circle = progressCircles[canvasIndex - 1];
      }
      if (!circle) return;
      var fillElement = circle.querySelector('.progress-fill');
      if (fillElement) {
        var circumference = 2 * Math.PI * 16;
        var offset = circumference - (progress * circumference);
        fillElement.style.strokeDashoffset = offset;
      }

      canvas5FirstScrollTriggered = false;
      canvas6FirstScrollTriggered = false;
      
      // Reset canvas6Finished only when going to scene 1 (home)
      if (sceneNum === 1) {
        canvas6Finished = false;
      }
      
      // Reset yoga swipe UI
      if (yogaSwipeDragger) yogaSwipeDragger.style.display = 'flex';
      if (yogaSwipeThumb) {
        yogaSwipeThumb.style.right = 'auto';
        yogaSwipeThumb.style.left = '90px'; // 110 - 20 centered at right
      }
      if (yogaSwipeTrack) yogaSwipeTrack.style.setProperty('--swipe-progress', '0%');
      yogaSwipeProgress = 0;
      
      // Reset canvas4 swipe UI
      if (canvas4SwipeDragger) canvas4SwipeDragger.style.display = 'flex';
      if (canvas4SwipeThumb) {
        canvas4SwipeThumb.style.left = '-20px'; // 0 - 20 centered at left
      }
      if (canvas4SwipeTrack) canvas4SwipeTrack.style.setProperty('--swipe-progress', '0%');
      canvas4SwipeProgress = 0;
      
      scene1Section.style.display = 'none';
      scene2Section.style.display = 'none';
      scene3Section.style.display = 'none';
      scene4Section.style.display = 'none';
      scene5Section.style.display = 'none';
      scene6Section.style.display = 'none';
      scene7Section.style.display = 'none';
      breathingSceneSection.style.display = 'none';
      canvas1Section.style.display = 'none';
      canvas2Section.style.display = 'none';
      canvas3Section.style.display = 'none';
      canvas4Section.style.display = 'none';
      canvas5Section.style.display = 'none';
      canvas6Section.style.display = 'none';
      yogaToKarateSection.style.display = 'none';
      
      resetCanvas6UI();
      
      scene1Section.classList.remove('paused');
      scene2Section.classList.remove('paused');
      scene3Section.classList.remove('paused');
      scene4Section.classList.remove('paused');
      scene5Section.classList.remove('paused');
      scene6Section.classList.remove('paused');
      scene7Section.classList.remove('paused');
      breathingSceneSection.classList.remove('paused');
      
      [scene1Video, scene2Video, scene3Video, scene4Video, scene5Video, scene6Video, scene7Video, breathingSceneVideo].forEach(function(video) {
        video.pause();
        video.currentTime = 0;
      });
      
      for (var i = 1; i <= 6; i++) {
        updateCanvasProgress(i, 0);
      }
      updateCanvasProgress('yoga', 0);
      
      currentFrame = 0; targetFrame = 0;
      currentFrame2 = 0; targetFrame2 = 0;
      currentFrame3 = 0; targetFrame3 = 0;
      currentFrame4 = 0; targetFrame4 = 0;
      currentFrame5 = 0; targetFrame5 = 0;
      currentFrame6 = 0; targetFrame6 = 0;
      currentYogaToKarateFrame = 0; targetYogaToKarateFrame = 0;
      
      scene1Played = false;
      scene2Played = false;
      scene4Played = false;
      scene5Played = false;
      scene6Played = false;
      scene7Played = false;
      breathingScenePlayed = false;
      
      // Reset sound flags so sounds can play again when navigating from menu
      soundPlayedAtWhoose = false;
      soundPlayedAtFrameSunTransition = false;
      soundPlayedAtFrameBreath = false;
      soundPlayedAtFrameGrass = false;
      soundPlayedAtFrameOutro = false;
      soundPlayedAtDojoToPot = false;
      
      if (!lenis) initLenis();
      
      document.body.classList.add('no-scroll');
      
      switch(sceneNum) {
        case 1:
          scene1Section.style.display = 'flex';
          scene1Section.classList.remove('paused');
          tapOverlay.classList.add('hidden');
          stopScrollingSound();
          scene1Video.play();
          updateActiveMenuButton(1);
          if (lenis) lenis.scrollTo(0, { immediate: true });
          else window.scrollTo(0, 0);
          maxScrollReached = 0;
          scene1Video.addEventListener('ended', function() {
            document.body.classList.remove('no-scroll');
            scene1Section.style.display = 'none';
            canvas1Section.style.display = 'block';
            drawFrame(0);
            if (lenis) lenis.scrollTo(canvas1Section.offsetTop, { immediate: true });
            else window.scrollTo(0, canvas1Section.offsetTop);
            maxScrollReached = canvas1Section.offsetTop;
            updateActiveMenuButton(1);
            startScrollingSound();
          }, { once: true });
          break;
        case 2:
          scene2Section.style.display = 'flex';
          scene2Section.classList.remove('paused');
          if (lenis) lenis.scrollTo(scene2Section.offsetTop, { immediate: true });
          else window.scrollTo(0, scene2Section.offsetTop);
          maxScrollReached = scene2Section.offsetTop;
          stopScrollingSound();
          scene2Video.play();
          updateActiveMenuButton(2);
          scene2Video.addEventListener('ended', function() {
            scene2Section.style.display = 'none';
            scene3Section.style.display = 'flex';
            scene3Section.classList.remove('paused');
            if (lenis) lenis.scrollTo(scene3Section.offsetTop, { immediate: true });
            else window.scrollTo(0, scene3Section.offsetTop);
            stopScrollingSound();
            scene3Video.play();
            updateActiveMenuButton(3);
            scene3Video.addEventListener('ended', function() {
              document.body.classList.remove('no-scroll');
              scene3Section.style.display = 'none';
              canvas2Section.style.display = 'block';
              drawFrame2(0);
              if (lenis) lenis.scrollTo(canvas2Section.offsetTop, { immediate: true });
              else window.scrollTo(0, canvas2Section.offsetTop);
              maxScrollReached = canvas2Section.offsetTop;
              updateActiveMenuButton(3);
              startScrollingSound();
            }, { once: true });
          }, { once: true });
          break;
        case 3:
          scene3Section.style.display = 'flex';
          scene3Section.classList.remove('paused');
          if (lenis) lenis.scrollTo(scene3Section.offsetTop, { immediate: true });
          else window.scrollTo(0, scene3Section.offsetTop);
          maxScrollReached = scene3Section.offsetTop;
          stopScrollingSound();
          scene3Video.play();
          updateActiveMenuButton(3);
          scene3Video.addEventListener('ended', function() {
            document.body.classList.remove('no-scroll');
            scene3Section.style.display = 'none';
            canvas2Section.style.display = 'block';
            drawFrame2(0);
            if (lenis) lenis.scrollTo(canvas2Section.offsetTop, { immediate: true });
            else window.scrollTo(0, canvas2Section.offsetTop);
            maxScrollReached = canvas2Section.offsetTop;
            updateActiveMenuButton(3);
            startScrollingSound();
          }, { once: true });
          break;
        case 5:
          scene4Section.style.display = 'flex';
          scene4Section.classList.remove('paused');
          if (lenis) lenis.scrollTo(scene4Section.offsetTop, { immediate: true });
          else window.scrollTo(0, scene4Section.offsetTop);
          maxScrollReached = scene4Section.offsetTop;
          stopScrollingSound();
          scene4Video.play();
          updateActiveMenuButton(5);
          scene4Video.addEventListener('ended', function() {
            document.body.classList.remove('no-scroll');
            scene4Section.style.display = 'none';
            canvas3Section.style.display = 'block';
            drawFrame3(0);
            if (lenis) lenis.scrollTo(canvas3Section.offsetTop, { immediate: true });
            else window.scrollTo(0, canvas3Section.offsetTop);
            maxScrollReached = canvas3Section.offsetTop;
            updateActiveMenuButton(5);
            startScrollingSound();
          }, { once: true });
          break;
        case 6:
          scene6Section.style.display = 'flex';
          scene6Section.classList.remove('paused');
          if (lenis) lenis.scrollTo(scene6Section.offsetTop, { immediate: true });
          else window.scrollTo(0, scene6Section.offsetTop);
          maxScrollReached = scene6Section.offsetTop;
          stopScrollingSound();
          scene6Video.play();
          updateActiveMenuButton(6);
          scene6Video.addEventListener('ended', function() {
            document.body.classList.remove('no-scroll');
            scene6Section.style.display = 'none';
            canvas5Section.style.display = 'block';
            drawFrame5(0);
            if (lenis) lenis.scrollTo(canvas5Section.offsetTop, { immediate: true });
            else window.scrollTo(0, canvas5Section.offsetTop);
            maxScrollReached = canvas5Section.offsetTop;
            updateActiveMenuButton(6);
            startScrollingSound();
          }, { once: true });
          break;
        case 7:
          scene7Section.style.display = 'flex';
          scene7Section.classList.remove('paused');
          if (lenis) lenis.scrollTo(scene7Section.offsetTop, { immediate: true });
          else window.scrollTo(0, scene7Section.offsetTop);
          maxScrollReached = scene7Section.offsetTop;
          stopScrollingSound();
          scene7Video.play();
          updateActiveMenuButton(7);
          scene7Video.addEventListener('ended', function() {
            document.body.classList.remove('no-scroll');
            scene7Section.style.display = 'none';
            canvas6Section.style.display = 'block';
            drawFrame6(0);
            resetCanvas6UI();
            if (lenis) lenis.scrollTo(canvas6Section.offsetTop, { immediate: true });
            else window.scrollTo(0, canvas6Section.offsetTop);
            maxScrollReached = canvas6Section.offsetTop;
            updateActiveMenuButton(7);
            startScrollingSound();
          }, { once: true });
          break;
      }
      
      updateActiveMenuButton(sceneNum);
    }

    function setupMenuNavigation() {
      var sceneButtons = document.querySelectorAll('.menu-nav button[data-scene]');
      sceneButtons.forEach(function(button) {
        button.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          var sceneId = button.getAttribute('data-scene');
          if (sceneId) switchToScene(sceneId);
        });
      });
    }

    function setupRewindButton() {
      if (rewindButton) {
        rewindButton.addEventListener('click', function() {
          switchToScene('1');
        });
      }
    }

    async function loadRemainingResources() {
      await Promise.all([
        preloadRemainingVideos(),
        preloadFrames3(),
        preloadFrames4(),
        preloadFrames5(),
        preloadFrames6(),
        preloadYogaToKarateFrames()
      ]);
      setupCanvas3();
      setupCanvas4();
      setupCanvas5();
      setupCanvas6();
      setupYogaToKarateCanvas();
      setupYogaSwipe();
      setupCanvas4Swipe();
      console.log('Background loading complete');
    }

    async function init() {
      window.scrollTo(0, 0);
      
      scene1Section.style.display = 'flex';
      scene1Section.style.opacity = '1';
      scene1Video.currentTime = 0;
      tapOverlay.classList.remove('hidden');
      scene1Played = false;
      scene2Played = false;
      maxScrollReached = 0;
      
      // Reset canvas6Finished flag
      canvas6Finished = false;
      
      // Reset sound flags
      soundPlayedAtWhoose = false;
      soundPlayedAtFrameSunTransition = false;
      soundPlayedAtFrameBreath = false;
      soundPlayedAtDojoToPot = false;
      soundPlayedAtFrameGrass = false;
      soundPlayedAtFrameOutro = false;
      
      canvas1Section.style.display = 'block';
      canvas2Section.style.display = 'none';
      canvas3Section.style.display = 'none';
      canvas4Section.style.display = 'none';
      canvas5Section.style.display = 'none';
      canvas6Section.style.display = 'none';
      yogaToKarateSection.style.display = 'none';
      scene2Section.style.display = 'none';
      scene3Section.style.display = 'none';
      scene4Section.style.display = 'none';
      scene5Section.style.display = 'none';
      scene6Section.style.display = 'none';
      scene7Section.style.display = 'none';
      breathingSceneSection.style.display = 'none';
      
      await preloadInitialVideos();
      await Promise.all([preloadFrames(), preloadFrames2()]);
      
      initialLoadingComplete = true;
      
      setupCanvas();
      setupCanvas2();
      setupScene1();
      setupMenuNavigation();
      setupRewindButton();
      resetCanvas6UI();
      setupVideoPausePlay();
      
      loader.classList.add('hidden');
      
      animate();
      animate2();
      animate3();
      animate4();
      animate5();
      animate6();
      animateYogaToKarate();
      
      loadRemainingResources();
    }

    init();
  </script>
</body>
</html>
